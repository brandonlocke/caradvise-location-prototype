<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarAdvise | Location prototype</title><meta name="description" content="Interactive CarAdvise map location and shop search prototype."><link rel="icon" type="image/svg+xml" href="assets/favicon.svg"><link rel="stylesheet" href="style.css"></head>
<body><main class="workspace"><aside class="review"><h1>Map location</h1><p class="intro">Try the search and default-location flow.</p><label for="scenario">Starting state</label><select id="scenario"><option value="zip">Saved ZIP, no permission</option><option value="device">Device location, no saved ZIP</option><option value="both">Saved ZIP + device location</option><option value="neither">Neither available</option></select><label for="region">Region</label><select id="region"><option value="US">United States</option><option value="CA">Canada</option></select><label for="permission">When “Use my location” is tapped</label><select id="permission"><option value="allow">Allow location</option><option value="deny">Deny permission</option><option value="fail">Location unavailable</option></select><button class="reset" id="reset">Reset scenario</button><div class="state"><h2>Current state</h2><dl><dt>Search area</dt><dd id="activeRead"></dd><dt>Saved default</dt><dd id="savedRead"></dd><dt>Shop filter</dt><dd id="shopRead"></dd></dl><button class="text" id="fresh">Start a fresh search</button></div></aside><section class="device" aria-label="CarAdvise mobile prototype"><div id="app"></div><div id="toast" role="status" aria-live="polite"></div></section></main><script src="app.js"></script></body></html>
